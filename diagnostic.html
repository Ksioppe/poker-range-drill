<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Diagnostic Poker Range Drill</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#111827;background:#f5f7fb}
    h1{font-size:1.5rem}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}
    button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:700;margin:4px 4px 4px 0}
    pre{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#166534}.err{color:#991b1b}
  </style>
</head>
<body>
  <h1>Diagnostic Poker Range Drill</h1>
  <p>Cette page lit les données locales et permet d'en exporter une sauvegarde. Elle ne supprime ni ne modifie aucune donnée.</p>
  <div class="card"><h2>État</h2><div id="status">Vérification en cours…</div></div>
  <div class="card"><h2>Ranges enregistrées</h2><div id="ranges-count">—</div><button id="export">Exporter une sauvegarde JSON</button></div>
  <div class="card"><h2>Historique</h2><div id="history-count">—</div></div>
  <div class="card"><h2>Détails</h2><pre id="details"></pre></div>
  <script>
  (() => {
    const status = document.getElementById('status');
    const rangesCount = document.getElementById('ranges-count');
    const historyCount = document.getElementById('history-count');
    const details = document.getElementById('details');
    let snapshot = { ranges: [], history: [] };
    if (!('indexedDB' in window)) {
      status.innerHTML = '<span class="err">IndexedDB n’est pas disponible dans ce navigateur.</span>';
      return;
    }
    const request = indexedDB.open('PokerRangeDrill');
    request.onerror = () => {
      status.innerHTML = '<span class="err">Impossible d’ouvrir la base : ' + String(request.error) + '</span>';
      details.textContent = 'Vérifie que tu utilises le même navigateur et le même profil que pour l’application.';
    };
    request.onsuccess = () => {
      const db = request.result;
      const stores = ['ranges', 'history'];
      const missing = stores.filter(name => !db.objectStoreNames.contains(name));
      if (missing.length) {
        status.innerHTML = '<span class="err">Base ouverte, mais magasin(s) absent(s) : ' + missing.join(', ') + '</span>';
        details.textContent = 'Magasins présents : ' + Array.from(db.objectStoreNames).join(', ');
        db.close(); return;
      }
      const tx = db.transaction(stores, 'readonly');
      const r = tx.objectStore('ranges').getAll();
      const h = tx.objectStore('history').getAll();
      let gotR = false, gotH = false;
      const finish = () => {
        if (!gotR || !gotH) return;
        snapshot = { ranges: r.result || [], history: h.result || [] };
        rangesCount.textContent = snapshot.ranges.length + ' range(s)';
        historyCount.textContent = snapshot.history.length + ' session(s)';
        status.innerHTML = '<span class="ok">Base locale accessible.</span>';
        details.textContent = 'Base : PokerRangeDrill\nRanges : ' + snapshot.ranges.length + '\nHistorique : ' + snapshot.history.length + '\nMagasins : ' + stores.join(', ');
        db.close();
      };
      r.onsuccess = () => { gotR = true; finish(); };
      h.onsuccess = () => { gotH = true; finish(); };
      r.onerror = h.onerror = () => {
        status.innerHTML = '<span class="err">Erreur lors de la lecture des données.</span>';
        db.close();
      };
    };
    document.getElementById('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'poker-range-drill-backup.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  })();
  </script>
</body>
</html>
