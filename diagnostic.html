<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Poker Range Drill</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }

    pre {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Diagnostic Poker Range Drill</h1>
  <pre id="result">Analyse en cours...</pre>

  <script>
    const output = document.getElementById("result");

    function show(message) {
      output.textContent += message + "\n";
    }

    output.textContent = "";

    show("Domaine : " + location.origin);
    show("");

    const request = indexedDB.open("PokerRangeDrill");

    request.onerror = function () {
      show("❌ Impossible d'ouvrir la base IndexedDB.");
      show("Erreur : " + request.error);
    };

    request.onsuccess = function () {
      const db = request.result;

      show("✅ Base trouvée : PokerRangeDrill");
      show("Version : " + db.version);
      show("");

      const stores = Array.from(db.objectStoreNames);

      show("Tables trouvées :");
      if (stores.length === 0) {
        show("Aucune table.");
      } else {
        stores.forEach(store => show("• " + store));
      }

      show("");

      if (!stores.includes("ranges")) {
        show("❌ La table 'ranges' n'existe pas.");
        return;
      }

      const transaction = db.transaction("ranges", "readonly");
      const store = transaction.objectStore("ranges");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = function () {
        const ranges = getAllRequest.result;

        show("Nombre de ranges trouvées : " + ranges.length);
        show("");

        if (ranges.length === 0) {
          show("❌ La table existe mais elle est vide.");
        } else {
          show("🎉 RANGES TROUVÉES !");
          show("");

          ranges.forEach((range, index) => {
            show(
              (index + 1) +
              ". " +
              (range.name || "(nom inconnu)")
            );
          });
        }

        db.close();
      };

      getAllRequest.onerror = function () {
        show("❌ Impossible de lire la table ranges.");
        show("Erreur : " + getAllRequest.error);
      };
    };
  </script>
</body>
</html>
